<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแสกนจุดตรวจในโรงงาน</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.awesome-markers/2.0.4/leaflet.awesome-markers.css">
    <link href="https://fonts.googleapis.com/css2?family=Bigshot+One&family=Noto+Sans+Thai:wght@100..900&display=swap"
        rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet" />    

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --dark-bg: #1f2937;
            --light-bg: #f9fafb;
            --card-bg: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* font-family: "Kanit", sans-serif; */
            /* background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); */
            min-height: 100vh;
            padding: 0;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--light-bg);
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 1.5rem;
            box-shadow: var(--shadow-lg);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .role-switcher {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .role-btn {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .role-btn.active {
            background: white;
            color: var(--primary-color);
        }

        /* Main Content */
        .main-content {
            padding: 1.5rem;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        /* Card */
        .card {
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Buttons */
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: center;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-warning {
            background: var(--warning-color);
            color: white;
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
        }

        .btn-secondary {
            background: var(--text-secondary);
            color: white;
        }

        .btn-block {
            width: 100%;
        }

        /* QR Code Display */
        .qr-display {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 0.5rem;
            margin: 1rem 0;
        }

        #qrcode {
            display: inline-block;
            padding: 1rem;
            background: white;
            border-radius: 0.5rem;
        }

        /* Camera Scanner */
        .scanner-container {
            position: relative;
            max-width: 500px;
            margin: 0 auto;
        }

        #scanner-video {
            width: 100%;
            border-radius: 0.5rem;
            background: #000;
        }

        .scanner-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            border: 3px solid var(--success-color);
            border-radius: 1rem;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
        }

        /* Map */
        #map {
            height: 400px;
            border-radius: 0.5rem;
            margin-top: 1rem;
        }

        /* List Items */
        .list-item {
            background: white;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 0.75rem;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .list-item:hover {
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }

        .list-item-content {
            flex: 1;
        }

        .list-item-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .list-item-meta {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .list-item-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-sm {
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
        }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }

        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-info {
            background: #dbeafe;
            color: #1e40af;
        }

        /* Image Upload Preview */
        .image-preview {
            max-width: 300px;
            margin: 1rem 0;
            border-radius: 0.5rem;
            overflow: hidden;
            border: 2px solid var(--border-color);
        }

        .image-preview img {
            width: 100%;
            display: block;
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Alert */
        .alert {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }

        .alert-warning {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #f59e0b;
        }

        .alert-danger {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }

        /* Grid Layout */
        .grid {
            display: grid;
            gap: 1rem;
        }

        .grid-2 {
            grid-template-columns: repeat(2, 1fr);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: var(--shadow);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .stat-label {
            font-size: 0.875rem;
            opacity: 0.9;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.25rem;
            }

            .grid-2 {
                grid-template-columns: 1fr;
            }

            .list-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
            }

            .list-item-actions {
                width: 100%;
            }

            .btn-sm {
                flex: 1;
            }
        }

        /* Hidden class */
        .hidden {
            display: none !important;
        }

        /* File input custom */
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 0.75rem;
            background: var(--light-bg);
            border: 2px dashed var(--border-color);
            border-radius: 0.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-input-label:hover {
            border-color: var(--primary-color);
            background: rgba(37, 99, 235, 0.05);
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 80px;
            right: 20px;
            background: white;
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            box-shadow: var(--shadow-lg);
            max-width: 400px;
            z-index: 9999;
            animation: slideIn 0.3s ease-out;
            border-left: 4px solid var(--success-color);
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .time-input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
    </style>

</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <!-- <h1>🏭 ระบบแสกนจุดตรวจในโรงงาน</h1> -->
            <div class="role-switcher">
                <button class="role-btn active" onclick="switchRole('security')">
                    🛡️ รปภ. (Security)
                </button>
                <button class="role-btn" onclick="switchRole('admin')">
                    ⚙️ จป. (Admin)
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">

            <!-- Security View -->
            <div id="security-view" class="view active">
                <!-- Quick Actions -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="total-checkpoints">0</div>
                        <div class="stat-label">จุดตรวจทั้งหมด</div>
                    </div>
                    <div class="stat-card" style="background: linear-gradient(135deg, #10b981, #059669);">
                        <div class="stat-value" id="scanned-today">0</div>
                        <div class="stat-label">แสกนวันนี้</div>
                    </div>
                </div>

                <!-- Scan QR Code -->
                <div class="card">
                    <div class="card-title">📷 แสกน QR Code</div>
                    <button class="btn btn-primary btn-block" onclick="startScanner()">
                        เปิดกล้องแสกน
                    </button>

                    <div id="scanner-section" class="hidden" style="margin-top: 1.5rem;">
                        <div class="scanner-container">
                            <video id="scanner-video" playsinline></video>
                            <div class="scanner-overlay"></div>
                            <canvas id="scanner-canvas" style="display: none;"></canvas>
                        </div>
                        <button class="btn btn-secondary btn-block" onclick="stopScanner()" style="margin-top: 1rem;">
                            ปิดกล้อง
                        </button>
                    </div>
                </div>

                <!-- Emergency Report -->
                <div class="card">
                    <div class="card-title">🚨 บันทึกเหตุฉุกเฉิน</div>
                    <form id="emergency-form" onsubmit="submitEmergency(event)">
                        <div class="form-group">
                            <label class="form-label">รายละเอียดเหตุการณ์</label>
                            <textarea class="form-textarea" id="emergency-detail" required
                                placeholder="อธิบายเหตุการณ์ที่เกิดขึ้น..."></textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label">ระดับความรุนแรง</label>
                            <select class="form-select" id="emergency-level" required>
                                <option value="">เลือกระดับ</option>
                                <option value="low">ต่ำ</option>
                                <option value="medium">กลาง</option>
                                <option value="high">สูง</option>
                                <option value="critical">วิกฤติ</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">รูปภาพประกอบ (ถ้ามี)</label>
                            <div class="file-input-wrapper">
                                <input type="file" id="emergency-photo" accept="image/*">
                                <label for="emergency-photo" class="file-input-label">
                                    📸 คลิกเพื่อถ่ายรูป/เลือกรูป
                                </label>
                            </div>
                            <div id="emergency-preview" class="image-preview hidden"></div>
                        </div>
                        <button type="submit" class="btn btn-danger btn-block">
                            ส่งรายงานฉุกเฉิน
                        </button>
                    </form>
                </div>

                <!-- Recent Scans -->
                <div class="card">
                    <div class="card-title">📋 ประวัติการแสกนล่าสุด</div>
                    <div id="recent-scans"></div>
                </div>
            </div>

            <!-- Admin View -->
            <div id="admin-view" class="view">
                <!-- Add Checkpoint -->
                <div class="card">
                    <div class="card-title">📍 เพิ่มจุดตรวจใหม่</div>
                    <form id="checkpoint-form" onsubmit="addCheckpoint(event)">
                        <div class="form-group">
                            <label class="form-label">ชื่อจุดตรวจ</label>
                            <input type="text" class="form-input" id="checkpoint-name" required
                                placeholder="เช่น ประตูหน้า, โกดัง A">
                        </div>
                        <div class="form-group">
                            <label class="form-label">รายละเอียด</label>
                            <textarea class="form-textarea" id="checkpoint-description"
                                placeholder="รายละเอียดเพิ่มเติม..."></textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label">รูปภาพประกอบ (ถ้ามี)</label>
                            <div class="file-input-wrapper">
                                <input type="file" id="checkpoint-photo" accept="image/*">
                                <label for="checkpoint-photo" class="file-input-label">
                                    📸 คลิกเพื่อถ่ายรูป/เลือกรูป
                                </label>
                            </div>
                            <div id="checkpoint-preview" class="image-preview hidden"></div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">
                            เพิ่มจุดตรวจและสร้าง QR Code
                        </button>
                    </form>
                </div>

                <!-- Checkpoint List -->
                <div class="card">
                    <div class="card-title">📌 รายการจุดตรวจทั้งหมด</div>
                    <div id="checkpoint-list"></div>
                </div>

                <!-- Add Round -->
                <div class="card">
                    <div class="card-title">⏰ กำหนดรอบตรวจ</div>
                    <form id="round-form" onsubmit="addRound(event)">
                        <div class="form-group">
                            <label class="form-label">ชื่อรอบตรวจ</label>
                            <input type="text" class="form-input" id="round-name" required
                                placeholder="เช่น รอบเช้า, รอบบ่าย">
                        </div>
                        <div class="form-group">
                            <label class="form-label">เวลาเริ่มต้น - สิ้นสุด</label>
                            <div class="time-input-group">
                                <input type="time" class="form-input" id="round-start" required>
                                <input type="time" class="form-input" id="round-end" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">แจ้งเตือนก่อนเวลา (นาที)</label>
                            <input type="number" class="form-input" id="round-remind" value="15" min="0"
                                placeholder="15">
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">
                            เพิ่มรอบตรวจ
                        </button>
                    </form>
                </div>

                <!-- Round List -->
                <div class="card">
                    <div class="card-title">🕐 รายการรอบตรวจ</div>
                    <div id="round-list"></div>
                </div>

                <!-- Emergency Reports -->
                <div class="card">
                    <div class="card-title">🚨 รายงานเหตุฉุกเฉิน</div>
                    <div id="emergency-list"></div>
                </div>

                <!-- Map View -->
                <div class="card">
                    <div class="card-title">🗺️ แผนที่จุดตรวจและการแสกน</div>
                    <div id="map"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <!-- QR Code Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.awesome-markers/2.0.4/leaflet.awesome-markers.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD5ZWVYevzL0Qj-H_jiVIL7WyH0vOp1kLs",
            authDomain: "test2-a3a49.firebaseapp.com",
            databaseURL: "https://test2-a3a49-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "test2-a3a49",
            storageBucket: "test2-a3a49.firebasestorage.app",
            messagingSenderId: "210722067503",
            appId: "1:210722067503:web:069f168981aa965392a2da",
            measurementId: "G-FEDYDSVGZC"
        };

        // Cloudinary Configuration
        const cloudinaryConfig = {
            cloudName: "domvtfj1i",
            uploadPreset: "testclaimdata",
            apiKey: "956358336591924",
            pid: "e2a06caa-be00-455e-9808-8a7df76618e9"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Global Variables
        let map = null;
        let markers = [];
        let scannerStream = null;
        let scannerInterval = null;

        // Generate UUID v4
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }



        // Switch Role View
        function switchRole(role) {
            const securityView = document.getElementById('security-view');
            const adminView = document.getElementById('admin-view');
            const roleBtns = document.querySelectorAll('.role-btn');

            roleBtns.forEach(btn => btn.classList.remove('active'));

            if (role === 'security') {
                securityView.classList.add('active');
                adminView.classList.remove('active');
                roleBtns[0].classList.add('active');
                loadRecentScans();
            } else {
                securityView.classList.remove('active');
                adminView.classList.add('active');
                roleBtns[1].classList.add('active');
                loadCheckpoints();
                loadRounds();
                loadEmergencies();
                initMap();
            }

            updateStats();
        }

        // Upload Image to Cloudinary
        async function uploadToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', cloudinaryConfig.uploadPreset);
            formData.append('folder', 'CHECK');

            try {
                const response = await fetch(
                    `https://api.cloudinary.com/v1_1/${cloudinaryConfig.cloudName}/image/upload`,
                    {
                        method: 'POST',
                        body: formData
                    }
                );
                const data = await response.json();
                return data.secure_url;
            } catch (error) {
                console.error('Error uploading to Cloudinary:', error);
                return null;
            }
        }

        // Add Checkpoint
        async function addCheckpoint(event) {
            event.preventDefault();

            const name = document.getElementById('checkpoint-name').value;
            const description = document.getElementById('checkpoint-description').value;
            const photoFile = document.getElementById('checkpoint-photo').files[0];

            showNotification('กำลังสร้างจุดตรวจ...', 'info');

            let photoUrl = null;
            if (photoFile) {
                photoUrl = await uploadToCloudinary(photoFile);
            }

            const checkpointId = generateUUID();
            const checkpointData = {
                id: checkpointId,
                name: name,
                description: description,
                photoUrl: photoUrl,
                createdAt: new Date().toISOString()
            };

            try {
                await database.ref('checkpoints/' + checkpointId).set(checkpointData);
                showNotification('เพิ่มจุดตรวจสำเร็จ!', 'success');
                document.getElementById('checkpoint-form').reset();
                document.getElementById('checkpoint-preview').classList.add('hidden');

                // Show QR Code
                showQRCode(checkpointId, name);
                loadCheckpoints();
            } catch (error) {
                showNotification('เกิดข้อผิดพลาด: ' + error.message, 'danger');
            }
        }

        // Show QR Code
        function showQRCode(checkpointId, checkpointName) {
            const qr = qrcode(0, 'M');
            qr.addData(checkpointId);
            qr.make();

            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.8);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10000;
                padding: 20px;
            `;

            modal.innerHTML = `
                <div style="background: white; padding: 2rem; border-radius: 1rem; max-width: 500px; width: 100%; text-align: center;">
                    <h2 style="margin-bottom: 1rem;">QR Code สำหรับ: ${checkpointName}</h2>
                    <div style="background: white; padding: 1rem; display: inline-block; border: 2px solid #e5e7eb; border-radius: 0.5rem;">
                        ${qr.createImgTag(5)}
                    </div>
                    <p style="margin: 1rem 0; color: #6b7280;">ID: ${checkpointId}</p>
                    <button onclick="this.parentElement.parentElement.remove()" class="btn btn-primary">
                        ปิด
                    </button>
                    <button onclick="downloadQRCode('${checkpointId}', '${checkpointName}')" class="btn btn-success" style="margin-left: 0.5rem;">
                        💾 ดาวน์โหลด QR Code
                    </button>
                </div>
            `;

            document.body.appendChild(modal);
            modal.onclick = (e) => {
                if (e.target === modal) modal.remove();
            };
        }

        // Download QR Code
        function downloadQRCode(checkpointId, checkpointName) {
            const qr = qrcode(0, 'M');
            qr.addData(checkpointId);
            qr.make();

            const canvas = document.createElement('canvas');
            const size = 300;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            const img = new Image();
            img.onload = function () {
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, size, size);
                ctx.drawImage(img, 0, 0, size, size);

                const link = document.createElement('a');
                link.download = `QR_${checkpointName.replace(/\s/g, '_')}.png`;
                link.href = canvas.toDataURL();
                link.click();
            };
            img.src = qr.createDataURL(5);
        }

        // Load Checkpoints
        function loadCheckpoints() {
            database.ref('checkpoints').on('value', (snapshot) => {
                const checkpoints = snapshot.val();
                const listDiv = document.getElementById('checkpoint-list');

                if (!checkpoints) {
                    listDiv.innerHTML = '<p style="text-align: center; color: #6b7280;">ยังไม่มีจุดตรวจ</p>';
                    return;
                }

                let html = '';
                Object.values(checkpoints).forEach(checkpoint => {
                    html += `
                        <div class="list-item">
                            <div class="list-item-content">
                                <div class="list-item-title">${checkpoint.name}</div>
                                <div class="list-item-meta">${checkpoint.description || 'ไม่มีรายละเอียด'}</div>
                                ${checkpoint.photoUrl ? `<img src="${checkpoint.photoUrl}" style="max-width: 200px; margin-top: 0.5rem; border-radius: 0.5rem;">` : ''}
                            </div>
                            <div class="list-item-actions">
                                <button class="btn btn-primary btn-sm" onclick="showQRCode('${checkpoint.id}', '${checkpoint.name}')">
                                    📱 QR Code
                                </button>
                                <button class="btn btn-danger btn-sm" onclick="deleteCheckpoint('${checkpoint.id}')">
                                    🗑️ ลบ
                                </button>
                            </div>
                        </div>
                    `;
                });

                listDiv.innerHTML = html;
            });
        }

        // Delete Checkpoint
        async function deleteCheckpoint(id) {
            if (confirm('ต้องการลบจุดตรวจนี้?')) {
                try {
                    await database.ref('checkpoints/' + id).remove();
                    showNotification('ลบจุดตรวจสำเร็จ', 'success');
                } catch (error) {
                    showNotification('เกิดข้อผิดพลาด: ' + error.message, 'danger');
                }
            }
        }

        // Add Round
        async function addRound(event) {
            event.preventDefault();

            const name = document.getElementById('round-name').value;
            const startTime = document.getElementById('round-start').value;
            const endTime = document.getElementById('round-end').value;
            const remindBefore = parseInt(document.getElementById('round-remind').value) || 0;

            const roundId = generateUUID();
            const roundData = {
                id: roundId,
                name: name,
                startTime: startTime,
                endTime: endTime,
                remindBefore: remindBefore,
                active: true,
                createdAt: new Date().toISOString()
            };

            try {
                await database.ref('rounds/' + roundId).set(roundData);
                showNotification('เพิ่มรอบตรวจสำเร็จ!', 'success');
                document.getElementById('round-form').reset();
                scheduleNotification(roundData);
            } catch (error) {
                showNotification('เกิดข้อผิดพลาด: ' + error.message, 'danger');
            }
        }

        // Load Rounds
        function loadRounds() {
            database.ref('rounds').on('value', (snapshot) => {
                const rounds = snapshot.val();
                const listDiv = document.getElementById('round-list');

                if (!rounds) {
                    listDiv.innerHTML = '<p style="text-align: center; color: #6b7280;">ยังไม่มีรอบตรวจ</p>';
                    return;
                }

                let html = '';
                Object.values(rounds).forEach(round => {
                    const badge = round.active ?
                        '<span class="badge badge-success">เปิดใช้งาน</span>' :
                        '<span class="badge badge-secondary">ปิดใช้งาน</span>';

                    html += `
                        <div class="list-item">
                            <div class="list-item-content">
                                <div class="list-item-title">${round.name} ${badge}</div>
                                <div class="list-item-meta">
                                    เวลา: ${round.startTime} - ${round.endTime} | 
                                    แจ้งเตือนก่อน: ${round.remindBefore} นาที
                                </div>
                            </div>
                            <div class="list-item-actions">
                                <button class="btn btn-warning btn-sm" onclick="toggleRound('${round.id}', ${!round.active})">
                                    ${round.active ? '⏸️ ปิด' : '▶️ เปิด'}
                                </button>
                                <button class="btn btn-danger btn-sm" onclick="deleteRound('${round.id}')">
                                    🗑️ ลบ
                                </button>
                            </div>
                        </div>
                    `;
                });

                listDiv.innerHTML = html;
            });
        }

        // Toggle Round
        async function toggleRound(id, active) {
            try {
                await database.ref('rounds/' + id).update({ active: active });
                showNotification(active ? 'เปิดรอบตรวจแล้ว' : 'ปิดรอบตรวจแล้ว', 'success');
            } catch (error) {
                showNotification('เกิดข้อผิดพลาด: ' + error.message, 'danger');
            }
        }

        // Delete Round
        async function deleteRound(id) {
            if (confirm('ต้องการลบรอบตรวจนี้?')) {
                try {
                    await database.ref('rounds/' + id).remove();
                    showNotification('ลบรอบตรวจสำเร็จ', 'success');
                } catch (error) {
                    showNotification('เกิดข้อผิดพลาด: ' + error.message, 'danger');
                }
            }
        }

        // Schedule Notification
        function scheduleNotification(round) {
            if (!round.active) return;

            const checkNotification = () => {
                const now = new Date();
                const [hours, minutes] = round.startTime.split(':');
                const roundTime = new Date();
                roundTime.setHours(parseInt(hours), parseInt(minutes), 0);

                const notifyTime = new Date(roundTime.getTime() - round.remindBefore * 60000);

                if (now >= notifyTime && now < roundTime) {
                    if (Notification.permission === 'granted') {
                        new Notification('⏰ แจ้งเตือนรอบตรวจ', {
                            body: `ใกล้ถึงเวลา${round.name} (${round.startTime})`,
                            icon: '🏭'
                        });
                    }
                    showNotification(`ใกล้ถึงเวลา${round.name} (${round.startTime})`, 'warning');
                }
            };

            setInterval(checkNotification, 60000); // Check every minute
        }

        /*
        1.แก้ไขแจ้งเตือนจ้งเวลา start ไม่ใช่ start-timebefore
        2.ให้แสดงแจ้งเตือน ใน webapp ด้วย
        */

        // Request Notification Permission
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // Start Scanner
        async function startScanner() {
            const video = document.getElementById('scanner-video');
            const canvas = document.getElementById('scanner-canvas');
            const scannerSection = document.getElementById('scanner-section');

            try {
                scannerStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                video.srcObject = scannerStream;
                video.play();
                scannerSection.classList.remove('hidden');

                const ctx = canvas.getContext('2d');

                scannerInterval = setInterval(() => {
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height);

                        if (code) {
                            handleScan(code.data);
                        }
                    }
                }, 100);
            } catch (error) {
                showNotification('ไม่สามารถเข้าถึงกล้องได้: ' + error.message, 'danger');
            }
        }

        // Stop Scanner
        function stopScanner() {
            if (scannerStream) {
                scannerStream.getTracks().forEach(track => track.stop());
                scannerStream = null;
            }
            if (scannerInterval) {
                clearInterval(scannerInterval);
                scannerInterval = null;
            }
            document.getElementById('scanner-section').classList.add('hidden');
        }

        // Handle Scan
        async function handleScan(checkpointId) {
            stopScanner();

            // Get current location
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    // Verify checkpoint exists
                    const checkpointSnapshot = await database.ref('checkpoints/' + checkpointId).once('value');
                    const checkpoint = checkpointSnapshot.val();

                    if (!checkpoint) {
                        showNotification('ไม่พบจุดตรวจนี้ในระบบ', 'danger');
                        return;
                    }

                    // Save scan record
                    const scanId = generateUUID();
                    const scanData = {
                        id: scanId,
                        checkpointId: checkpointId,
                        checkpointName: checkpoint.name,
                        latitude: lat,
                        longitude: lng,
                        timestamp: new Date().toISOString(),
                        date: new Date().toLocaleDateString('th-TH'),
                        time: new Date().toLocaleTimeString('th-TH')
                    };

                    try {
                        await database.ref('scans/' + scanId).set(scanData);
                        showNotification(`✅ แสกนจุดตรวจ "${checkpoint.name}" สำเร็จ!`, 'success');
                        updateStats();
                        loadRecentScans();
                    } catch (error) {
                        showNotification('เกิดข้อผิดพลาด: ' + error.message, 'danger');
                    }
                }, (error) => {
                    showNotification('ไม่สามารถระบุตำแหน่งได้: ' + error.message, 'warning');
                });
            } else {
                showNotification('เบราว์เซอร์ไม่รองรับการระบุตำแหน่ง', 'warning');
            }
        }

        // Load Recent Scans
        function loadRecentScans() {
            database.ref('scans').orderByChild('timestamp').limitToLast(10).on('value', (snapshot) => {
                const scans = snapshot.val();
                const listDiv = document.getElementById('recent-scans');

                if (!scans) {
                    listDiv.innerHTML = '<p style="text-align: center; color: #6b7280;">ยังไม่มีประวัติการแสกน</p>';
                    return;
                }

                let html = '';
                const scanArray = Object.values(scans).reverse();

                scanArray.forEach(scan => {
                    html += `
                        <div class="list-item">
                            <div class="list-item-content">
                                <div class="list-item-title">${scan.checkpointName}</div>
                                <div class="list-item-meta">
                                    📅 ${scan.date} ⏰ ${scan.time}<br>
                                    📍 ${scan.latitude.toFixed(6)}, ${scan.longitude.toFixed(6)}
                                </div>
                            </div>
                        </div>
                    `;
                });

                listDiv.innerHTML = html;
            });
        }

        // Submit Emergency
        async function submitEmergency(event) {
            event.preventDefault();

            const detail = document.getElementById('emergency-detail').value;
            const level = document.getElementById('emergency-level').value;
            const photoFile = document.getElementById('emergency-photo').files[0];

            showNotification('กำลังส่งรายงาน...', 'info');

            let photoUrl = null;
            if (photoFile) {
                photoUrl = await uploadToCloudinary(photoFile);
            }

            // Get current location
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const emergencyId = generateUUID();
                    const emergencyData = {
                        id: emergencyId,
                        detail: detail,
                        level: level,
                        photoUrl: photoUrl,
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        timestamp: new Date().toISOString(),
                        date: new Date().toLocaleDateString('th-TH'),
                        time: new Date().toLocaleTimeString('th-TH'),
                        status: 'pending'
                    };

                    try {
                        await database.ref('emergencies/' + emergencyId).set(emergencyData);
                        showNotification('ส่งรายงานฉุกเฉินสำเร็จ!', 'success');
                        document.getElementById('emergency-form').reset();
                        document.getElementById('emergency-preview').classList.add('hidden');
                    } catch (error) {
                        showNotification('เกิดข้อผิดพลาด: ' + error.message, 'danger');
                    }
                });
            } else {
                const emergencyId = generateUUID();
                const emergencyData = {
                    id: emergencyId,
                    detail: detail,
                    level: level,
                    photoUrl: photoUrl,
                    timestamp: new Date().toISOString(),
                    date: new Date().toLocaleDateString('th-TH'),
                    time: new Date().toLocaleTimeString('th-TH'),
                    status: 'pending'
                };

                try {
                    await database.ref('emergencies/' + emergencyId).set(emergencyData);
                    showNotification('ส่งรายงานฉุกเฉินสำเร็จ!', 'success');
                    document.getElementById('emergency-form').reset();
                } catch (error) {
                    showNotification('เกิดข้อผิดพลาด: ' + error.message, 'danger');
                }
            }
        }

        // Load Emergencies
        function loadEmergencies() {
            database.ref('emergencies').on('value', (snapshot) => {
                const emergencies = snapshot.val();
                const listDiv = document.getElementById('emergency-list');

                if (!emergencies) {
                    listDiv.innerHTML = '<p style="text-align: center; color: #6b7280;">ไม่มีรายงานฉุกเฉิน</p>';
                    return;
                }

                let html = '';
                const emergencyArray = Object.values(emergencies).reverse();

                emergencyArray.forEach(emergency => {
                    const levelColors = {
                        'low': 'badge-info',
                        'medium': 'badge-warning',
                        'high': 'badge-danger',
                        'critical': 'badge-danger'
                    };

                    const levelTexts = {
                        'low': 'ต่ำ',
                        'medium': 'กลาง',
                        'high': 'สูง',
                        'critical': 'วิกฤติ'
                    };

                    const statusBadge = emergency.status === 'pending' ?
                        '<span class="badge badge-warning">รอดำเนินการ</span>' :
                        '<span class="badge badge-success">ดำเนินการแล้ว</span>';

                    html += `
                        <div class="list-item">
                            <div class="list-item-content">
                                <div class="list-item-title">
                                    ${emergency.detail}
                                    <span class="badge ${levelColors[emergency.level]}">${levelTexts[emergency.level]}</span>
                                    ${statusBadge}
                                </div>
                                <div class="list-item-meta">
                                    📅 ${emergency.date} ⏰ ${emergency.time}
                                    ${emergency.latitude ? `<br>📍 ${emergency.latitude.toFixed(6)}, ${emergency.longitude.toFixed(6)}` : ''}
                                </div>
                                ${emergency.photoUrl ? `<img src="${emergency.photoUrl}" style="max-width: 200px; margin-top: 0.5rem; border-radius: 0.5rem;">` : ''}
                            </div>
                            <div class="list-item-actions">
                                ${emergency.status === 'pending' ?
                            `<button class="btn btn-success btn-sm" onclick="resolveEmergency('${emergency.id}')">✓ ดำเนินการแล้ว</button>` :
                            ''}
                                <button class="btn btn-danger btn-sm" onclick="deleteEmergency('${emergency.id}')">🗑️ ลบ</button>
                            </div>
                        </div>
                    `;
                });

                listDiv.innerHTML = html;
            });
        }

        // Resolve Emergency
        async function resolveEmergency(id) {
            try {
                await database.ref('emergencies/' + id).update({ status: 'resolved' });
                showNotification('อัพเดทสถานะสำเร็จ', 'success');
            } catch (error) {
                showNotification('เกิดข้อผิดพลาด: ' + error.message, 'danger');
            }
        }

        // Delete Emergency
        async function deleteEmergency(id) {
            if (confirm('ต้องการลบรายงานนี้?')) {
                try {
                    await database.ref('emergencies/' + id).remove();
                    showNotification('ลบรายงานสำเร็จ', 'success');
                } catch (error) {
                    showNotification('เกิดข้อผิดพลาด: ' + error.message, 'danger');
                }
            }
        }

        // Initialize Map
        function initMap() {
            if (map) {
                map.remove();
            }

            map = L.map('map').setView([13.7563, 100.5018], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            // Load scan locations
            database.ref('scans').on('value', (snapshot) => {
                // Clear existing markers
                markers.forEach(marker => marker.remove());
                markers = [];

                const scans = snapshot.val();
                if (scans) {
                    Object.values(scans).forEach(scan => {
                        if (scan.latitude && scan.longitude) {
                            const marker = L.marker([scan.latitude, scan.longitude])
                                .addTo(map)
                                .bindPopup(`
                                    <strong>${scan.checkpointName}</strong><br>
                                    ${scan.date} ${scan.time}
                                `);
                            markers.push(marker);
                        }
                    });

                    // Fit bounds if there are markers
                    if (markers.length > 0) {
                        const group = L.featureGroup(markers);
                        map.fitBounds(group.getBounds().pad(0.1));
                    }
                }
            });
        }

        // Update Statistics
        function updateStats() {
            database.ref('checkpoints').once('value', (snapshot) => {
                const count = snapshot.exists() ? Object.keys(snapshot.val()).length : 0;
                document.getElementById('total-checkpoints').textContent = count;
            });

            const today = new Date().toLocaleDateString('th-TH');
            database.ref('scans').orderByChild('date').equalTo(today).once('value', (snapshot) => {
                const count = snapshot.exists() ? Object.keys(snapshot.val()).length : 0;
                document.getElementById('scanned-today').textContent = count;
            });
        }

        // Show Notification
        function showNotification(message, type = 'info') {
            const colors = {
                'success': '#10b981',
                'warning': '#f59e0b',
                'danger': '#ef4444',
                'info': '#3b82f6'
            };

            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.style.borderLeftColor = colors[type];
            notification.textContent = message;

            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Image Preview Handlers
        document.getElementById('checkpoint-photo').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const preview = document.getElementById('checkpoint-preview');
                    preview.innerHTML = `<img src="${e.target.result}">`;
                    preview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('emergency-photo').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const preview = document.getElementById('emergency-preview');
                    preview.innerHTML = `<img src="${e.target.result}">`;
                    preview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // Initialize
        updateStats();
        loadRecentScans();

        // Check for active rounds and schedule notifications
        database.ref('rounds').once('value', (snapshot) => {
            const rounds = snapshot.val();
            if (rounds) {
                Object.values(rounds).forEach(round => {
                    if (round.active) {
                        scheduleNotification(round);
                    }
                });
            }
        });
    </script>
</body>

</html>
