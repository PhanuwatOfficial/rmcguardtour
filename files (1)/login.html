<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1e40af">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>เข้าสู่ระบบ - Patrol System</title>
  
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .login-container {
      background: white;
      border-radius: 25px;
      padding: 50px 40px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 25px 70px rgba(0,0,0,0.3);
      animation: slideUp 0.5s ease;
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .logo {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .logo-icon {
      font-size: 60px;
      margin-bottom: 10px;
    }
    
    .logo h1 {
      font-size: 28px;
      color: #1e40af;
      margin-bottom: 5px;
    }
    
    .logo p {
      color: #64748b;
      font-size: 14px;
    }
    
    .role-selector {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      background: #f8fafc;
      padding: 5px;
      border-radius: 15px;
    }
    
    .role-option {
      flex: 1;
      padding: 15px;
      background: transparent;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 15px;
      font-weight: 600;
      color: #64748b;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    
    .role-option .icon {
      font-size: 24px;
    }
    
    .role-option.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #334155;
      font-weight: 600;
      font-size: 14px;
    }
    
    .input-wrapper {
      position: relative;
    }
    
    .input-wrapper .icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 20px;
    }
    
    input {
      width: 100%;
      padding: 15px 15px 15px 50px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      transition: all 0.3s;
      background: #f8fafc;
    }
    
    input:focus {
      outline: none;
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .divider {
      text-align: center;
      margin: 30px 0;
      position: relative;
    }
    
    .divider::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background: #e2e8f0;
    }
    
    .divider span {
      background: white;
      padding: 0 15px;
      color: #94a3b8;
      font-size: 14px;
      position: relative;
      z-index: 1;
    }
    
    .links {
      text-align: center;
      margin-top: 25px;
    }
    
    .links a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
    
    .links a:hover {
      text-decoration: underline;
    }
    
    .error-message {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
      border-left: 4px solid #dc2626;
    }
    
    .error-message.show {
      display: block;
      animation: shake 0.5s;
    }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }
    
    .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }
    
    .loading.show {
      display: block;
    }
    
    .spinner {
      border: 3px solid #f3f4f6;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .demo-accounts {
      background: #f0f9ff;
      border: 2px solid #bfdbfe;
      border-radius: 12px;
      padding: 15px;
      margin-top: 20px;
      font-size: 13px;
    }
    
    .demo-accounts h4 {
      color: #1e40af;
      margin-bottom: 10px;
      font-size: 14px;
    }
    
    .demo-accounts p {
      color: #1e40af;
      margin: 5px 0;
      font-family: 'Courier New', monospace;
    }
    
    @media (max-width: 480px) {
      .login-container {
        padding: 40px 25px;
      }
      
      .logo h1 {
        font-size: 24px;
      }
      
      .role-option {
        padding: 12px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon">🔍</div>
      <h1>Patrol System</h1>
      <p>ระบบตรวจจุดการเดินตรวจ</p>
    </div>
    
    <!-- Error Message -->
    <div class="error-message" id="errorMessage"></div>
    
    <!-- Loading -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p style="color: #64748b;">กำลังเข้าสู่ระบบ...</p>
    </div>
    
    <!-- Login Form -->
    <div id="loginForm">
      <!-- Role Selector -->
      <div class="role-selector">
        <button class="role-option active" onclick="selectRole('inspector')" id="roleInspector">
          <span class="icon">👷</span>
          <span>ผู้ตรวจการ</span>
        </button>
        <button class="role-option" onclick="selectRole('admin')" id="roleAdmin">
          <span class="icon">👨‍💼</span>
          <span>ผู้ดูแลระบบ</span>
        </button>
      </div>
      
      <!-- Email -->
      <div class="form-group">
        <label for="email">อีเมล</label>
        <div class="input-wrapper">
          <span class="icon">📧</span>
          <input type="email" id="email" placeholder="your@email.com" autocomplete="email" required>
        </div>
      </div>
      
      <!-- Password -->
      <div class="form-group">
        <label for="password">รหัสผ่าน</label>
        <div class="input-wrapper">
          <span class="icon">🔒</span>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
      </div>
      
      <!-- Login Button -->
      <button class="btn" onclick="handleLogin()" id="loginBtn">
        เข้าสู่ระบบ
      </button>
      
      <!-- Divider -->
      <div class="divider">
        <span>หรือ</span>
      </div>
      
      <!-- Links -->
      <div class="links">
        <a href="#" onclick="showRegister(); return false;">สร้างบัญชีใหม่</a>
        ·
        <a href="#" onclick="resetPassword(); return false;">ลืมรหัสผ่าน?</a>
      </div>
      
      <!-- Demo Accounts -->
      <div class="demo-accounts">
        <h4>🎯 บัญชีทดสอบ</h4>
        <p><strong>Admin:</strong> admin@demo.com / admin123</p>
        <p><strong>Inspector:</strong> inspector@demo.com / inspector123</p>
      </div>
    </div>
  </div>
  
  <script src="firebase-config.js"></script>
  <script>
    let selectedRole = 'inspector';
    
    // Check if already logged in
    auth.onAuthStateChanged((user) => {
      if (user) {
        // Already logged in, redirect
        redirectBasedOnRole(user);
      }
    });
    
    // Select role
    function selectRole(role) {
      selectedRole = role;
      
      // Update UI
      document.getElementById('roleInspector').classList.toggle('active', role === 'inspector');
      document.getElementById('roleAdmin').classList.toggle('active', role === 'admin');
    }
    
    // Handle login
    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      // Validate
      if (!email || !password) {
        showError('กรุณากรอกอีเมลและรหัสผ่าน');
        return;
      }
      
      // Show loading
      showLoading(true);
      hideError();
      
      try {
        // Sign in
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;
        
        // Get user data
        const snapshot = await database.ref(`users/${user.uid}`).once('value');
        const userData = snapshot.val();
        
        if (!userData) {
          // User doesn't exist in database, create profile
          await createUserProfile(user, selectedRole);
          redirectToApp(selectedRole);
        } else {
          // Check if role matches
          if (userData.role !== selectedRole) {
            showError(`บัญชีนี้เป็น ${userData.role === 'admin' ? 'ผู้ดูแลระบบ' : 'ผู้ตรวจการ'} กรุณาเลือกบทบาทที่ถูกต้อง`);
            await auth.signOut();
            showLoading(false);
            return;
          }
          
          // Check if account is active
          if (userData.isActive === false) {
            showError('บัญชีนี้ถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ');
            await auth.signOut();
            showLoading(false);
            return;
          }
          
          // Success - redirect
          redirectToApp(userData.role);
        }
        
      } catch (error) {
        console.error('Login error:', error);
        
        let message = 'เข้าสู่ระบบไม่สำเร็จ';
        
        switch (error.code) {
          case 'auth/invalid-email':
            message = 'รูปแบบอีเมลไม่ถูกต้อง';
            break;
          case 'auth/user-disabled':
            message = 'บัญชีนี้ถูกปิดการใช้งาน';
            break;
          case 'auth/user-not-found':
            message = 'ไม่พบบัญชีนี้ในระบบ';
            break;
          case 'auth/wrong-password':
            message = 'รหัสผ่านไม่ถูกต้อง';
            break;
          case 'auth/too-many-requests':
            message = 'พยายามเข้าสู่ระบบหลายครั้งเกินไป กรุณารอสักครู่';
            break;
          default:
            message = error.message;
        }
        
        showError(message);
        showLoading(false);
      }
    }
    
    // Create user profile in database
    async function createUserProfile(user, role) {
      const userData = {
        uid: user.uid,
        email: user.email,
        displayName: user.displayName || user.email.split('@')[0],
        role: role,
        createdAt: firebase.database.ServerValue.TIMESTAMP,
        isActive: true,
        phone: user.phoneNumber || ''
      };
      
      await database.ref(`users/${user.uid}`).set(userData);
    }
    
    // Redirect based on role
    async function redirectBasedOnRole(user) {
      const snapshot = await database.ref(`users/${user.uid}/role`).once('value');
      const role = snapshot.val() || 'inspector';
      redirectToApp(role);
    }
    
    // Redirect to app
    function redirectToApp(role) {
      if (role === 'admin') {
        window.location.href = 'admin-dashboard.html';
      } else {
        window.location.href = 'inspector-mobile.html';
      }
    }
    
    // Show error
    function showError(message) {
      const errorEl = document.getElementById('errorMessage');
      errorEl.textContent = message;
      errorEl.classList.add('show');
    }
    
    // Hide error
    function hideError() {
      const errorEl = document.getElementById('errorMessage');
      errorEl.classList.remove('show');
    }
    
    // Show/hide loading
    function showLoading(show) {
      document.getElementById('loading').classList.toggle('show', show);
      document.getElementById('loginForm').style.display = show ? 'none' : 'block';
      document.getElementById('loginBtn').disabled = show;
    }
    
    // Reset password
    async function resetPassword() {
      const email = document.getElementById('email').value.trim();
      
      if (!email) {
        showError('กรุณากรอกอีเมลก่อนคลิก "ลืมรหัสผ่าน"');
        return;
      }
      
      try {
        await auth.sendPasswordResetEmail(email);
        alert(`✅ ส่งลิงก์รีเซ็ตรหัสผ่านไปที่ ${email} แล้ว\nกรุณาตรวจสอบอีเมล`);
      } catch (error) {
        showError('ไม่สามารถส่งอีเมลรีเซ็ตรหัสผ่านได้: ' + error.message);
      }
    }
    
    // Show register (placeholder)
    function showRegister() {
      alert('ฟีเจอร์สร้างบัญชีใหม่\n\nสำหรับการใช้งานจริง:\n- Admin สร้างบัญชีผ่าน Firebase Console\n- หรือพัฒนาหน้า Register แยก');
    }
    
    // Enter key to login
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        handleLogin();
      }
    });
  </script>
</body>
</html>
